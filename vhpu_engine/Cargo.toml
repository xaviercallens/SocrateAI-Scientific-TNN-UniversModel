[package]
name = "vhpu_engine"
version = "0.1.0"
edition = "2021"
description = "Virtual Hyper-Arity Processing Unit (vHPU) for the TNN Univers Model"
authors = ["Xavier Callens <xavier.callens@socrate.ai>"]

[dependencies]
# Standard Rust libraries
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"

# Local RunuX AI Runtime dependencies (from reference_repos)
ai_runtime = { path = "../reference_repos/runux-ai-runtime/crates/ai_runtime" }
hal = { path = "../reference_repos/runux-ai-runtime/crates/hal" }
rvv_simd = { path = "../reference_repos/runux-ai-runtime/crates/rvv_simd" }
tpu_pjrt = { path = "../reference_repos/runux-ai-runtime/crates/tpu_pjrt" }
mlgo_advisor = { path = "../reference_repos/runux-ai-runtime/crates/mlgo_advisor" }
turbo_quant = { path = "../reference_repos/runux-ai-runtime/crates/turbo_quant" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
