[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "tnn-univers-model"
version = "0.2.0"
description = "TNN (Thermodynamic, Topological, Tensor Neural Network) Univers Model — Physics-Informed AI. Note: 'Topological' scoped to EGNN/TDA pillars only; see NAMING_POLICY.md"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Xavier Callens", email = "xavier.callens@socrate.ai" },
]
keywords = ["physics-ml", "hamiltonian-nn", "equivariant-gnn", "fourier-neural-operator", "v-jepa"]

dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "imageio>=2.34.0",
    "tensorly>=0.8.1",
    "tensorly-torch>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["tnn*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
